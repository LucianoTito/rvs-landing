# Configuración de despliegue para Netlify.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # El sitio es estático: no hay proceso de compilación.
  publish = "."

[build.environment]
  # Oculta el distintivo "Powered by Netlify" en el pie del sitio.
  HIDE_NETLIFY_BRANDING = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los archivos con hash de contenido pueden cachearse mucho tiempo.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"